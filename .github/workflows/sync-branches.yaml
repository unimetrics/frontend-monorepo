name: Sync Branches

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  sync-main-to-test-and-dev:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create helper bot token
        id: helper-bot-token
        uses: ./.github/actions/create-helper-bot-token
        with:
          app-id: ${{ secrets.HELPER_BOT_ID }}
          private-key: ${{ secrets.HELPER_BOT_KEY }}

      - name: Create or update sync PRs
        env:
          GITHUB_TOKEN: ${{ steps.helper-bot-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: main
          TARGET_BRANCHES: test dev
        run: bash scripts/github/sync-branch-prs/sync-branch-prs.sh

  sync-test-to-dev:
    if: github.ref_name == 'test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create helper bot token
        id: helper-bot-token
        uses: ./.github/actions/create-helper-bot-token
        with:
          app-id: ${{ secrets.HELPER_BOT_ID }}
          private-key: ${{ secrets.HELPER_BOT_KEY }}

      - name: Create or update sync PR
        env:
          GITHUB_TOKEN: ${{ steps.helper-bot-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: test
          TARGET_BRANCHES: dev
        run: bash scripts/github/sync-branch-prs/sync-branch-prs.sh
