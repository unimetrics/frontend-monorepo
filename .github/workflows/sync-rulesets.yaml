name: Sync branches rulesets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/rulesets/**"
      - "scripts/github/apply-rulesets/**"
      - ".github/workflows/sync-rulesets.yaml"

permissions:
  contents: read

jobs:
  sync-rulesets:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create helper bot token
        id: helper-bot-token
        uses: ./.github/actions/create-helper-bot-token
        with:
          app-id: ${{ secrets.HELPER_BOT_ID }}
          private-key: ${{ secrets.HELPER_BOT_KEY }}

      - name: Validate ruleset payloads
        run: |
          set -euo pipefail
          for file in .github/rulesets/*.json; do
            jq empty "$file"
          done

      - name: Apply rulesets
        env:
          GH_TOKEN: ${{ steps.helper-bot-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/github/apply-rulesets/apply-rulesets.sh
